<html>
    <head>
        <style>
            .green_bar {
                background-color: #54d15A;
                height: 10px;
                width: 100%;
                margin-top: 4px;
                margin-bottom: 4px;
            }

            .otp_container {
                display: flex;
                justify-content: center;
            }

            .otp_num {
                display: block;
                width: 45px;
                height: 55px;
                line-height: 55px;
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                background-color: #ffffff;
                margin-right: 4px;
            }
        </style>
    </head>
    <body>
        <div class="green_bar">&nbsp;</div>
        <h2>Hi there!</h2>
        <h3>Here is your one time password regarding your recent password reset:</h3>
        <div class="otp_container">
            {% for num in otp %}
                <div class="otp_num">{{num}}</div>
            {% endfor %}
        </div>
        <h3>This password will expire in {{exp_time}} minutes.</h3>
        <h4>Do not reply to this email, but if this was not you, please notify us at <a href="mailto:identiflora.app@gmail.com">our email</a>.</h4>
        <div class="green_bar">&nbsp;</div>
    </body>
</html>
